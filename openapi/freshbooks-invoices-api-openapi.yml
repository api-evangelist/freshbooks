openapi: 3.2.0
info:
  title: FreshBooks REST Invoices API
  version: '2026-05-23'
  description: 'Best-effort OpenAPI 3.1 description of the FreshBooks accounting REST API.

    Scoped per account via /accounting/account/{accountId}/* paths.

    Generated from public documentation; not an official spec.'
  contact:
    name: FreshBooks Developer Portal
    url: https://www.freshbooks.com/api/start
servers:
- url: https://api.freshbooks.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Invoices
paths:
  /accounting/account/{accountId}/invoices/invoices:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    get:
      tags:
      - Invoices
      operationId: listInvoices
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: List invoices
      x-summary-source: derived
    post:
      tags:
      - Invoices
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Create invoice
      x-summary-source: derived
  /accounting/account/{accountId}/invoices/invoices/{invoiceId}:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    - in: path
      name: invoiceId
      required: true
      schema:
        type: string
    get:
      tags:
      - Invoices
      operationId: getInvoice
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Get invoice
      x-summary-source: derived
    put:
      tags:
      - Invoices
      operationId: updateInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Update invoice
      x-summary-source: derived
components:
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Object'
  schemas:
    Object:
      type: object
      additionalProperties: true
  parameters:
    AccountId:
      in: path
      name: accountId
      required: true
      schema:
        type: string
      description: FreshBooks account identifier (business account id)
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token obtained via the FreshBooks authorization code flow.
