apis:
- aid: freshbooks:freshbooks-api
  name: FreshBooks REST API
  description: >-
    REST API for FreshBooks providing CRUD access to clients, invoices, estimates, expenses, projects,
    time entries, tasks, payments, items, taxes, and accounting reports. Uses OAuth 2.0 Bearer tokens
    and is scoped per account via /accounting/account/{accountId}/* endpoints.
  humanURL: https://www.freshbooks.com/api/start
  baseURL: https://api.freshbooks.com
  tags:
  - Accounting
  - Invoicing
  - Expenses
  - Time Tracking
  - Project
  tags_raw:
