  - type: PostmanCollection
    url: https://www.freshbooks.com/api/start
- aid: freshbooks:freshbooks-webhooks
  name: FreshBooks Webhooks (Callbacks API)
  description: >-
    Event delivery surface for the FreshBooks Callbacks API. Subscribers register an HTTPS endpoint, complete
    a verifier handshake, and then receive HMAC-SHA256 signed POSTs (application/x-www-form-urlencoded)
    for noun.verb events across bills, bill vendors, categories, clients, credit notes, estimates, expenses,
    invoices, items, payments, projects, recurring templates, services, taxes, and time entries.
  humanURL: https://www.freshbooks.com/api/webhooks
  baseURL: https://api.freshbooks.com
